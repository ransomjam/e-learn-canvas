# Render Blueprint – Cradema.
#
# This matches the CURRENT working setup:
#   - one Web Service that builds the React frontend AND runs the Express API
#   - the existing managed PostgreSQL database (elearn-canvas-db)
#   - Cloudflare R2 for images/PDFs/docs and Bunny Stream for videos
#
# NOTE: the live service is configured from the Render dashboard, not from this
# file. This blueprint is kept accurate so it is safe if you ever re-sync it.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: e-learn-canvas
    runtime: node
    plan: starter
    # Builds the frontend into dist/ and installs backend deps (see package.json)
    buildCommand: npm run render-build
    startCommand: cd backend && npm run migrate:all && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Existing managed database — keep pointing at it
      - key: DATABASE_URL
        fromDatabase:
          name: elearn-canvas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Fapshi payments
      - key: FAPSHI_APIUSER
        sync: false
      - key: FAPSHI_APIKEY
        sync: false
      - key: FAPSHI_BASE_URL
        value: https://live.fapshi.com
      - key: FAPSHI_WEBHOOK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # SMTP (Brevo)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # ── Cloudflare R2 — images, PDFs, documents ──────────────────────────────
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # ── Bunny Stream — course videos ─────────────────────────────────────────
      - key: BUNNY_LIBRARY_ID
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: BUNNY_CDN_HOST
        sync: false
      # ── Cloudinary — LEGACY. Keep until the storage migration is verified, ────
      # then delete these three and the old assets.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: elearn-canvas-db
    plan: basic-256mb
    databaseName: elearn_canvas_db
    user: elearn_canvas_db_user
